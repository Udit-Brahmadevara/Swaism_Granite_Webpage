<body data-page="contact">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" data-site-header></header>

<main id="main">

  <section class="masthead">
    <div class="masthead__texture" aria-hidden="true"></div>
    <div class="masthead__inner">
      <p class="eyebrow">B2B Inquiry</p>
      <h1 class="display display--page">Have a project in mind,<br>or need a quote?</h1>
      <p>We'd love to hear from you — on granite blocks, slabs, tiles, monuments or custom work.</p>
    </div>
  </section>

  <section class="band band--intro">
    <div class="shell split split--start">
      <div>
        <h2 class="display display--block t-green mb-md">Get in Touch</h2>
        <dl class="contact-lines mb-xl" data-contact-lines></dl>
        <div class="contact-actions" data-contact-actions></div>
        <dl class="hours mb-xl" data-hours></dl>
        <!-- Locator, not an embed. A live Google Maps iframe sets third-party
             cookies the moment it loads, which is the whole reason a site like
             this would otherwise need a consent banner. The address, the
             coordinates and a directions link do the job a buyer actually needs
             without a third-party request, and the map is visible immediately
             rather than waiting on a tap. -->
        <div class="locator">
          <div class="locator__map" aria-hidden="true">
            <span class="locator__pin"></span>
            <span class="locator__ring"></span>
          </div>
          <div class="locator__body">
            <p class="locator__place">Shoolgiri / Sappadi, Hosur</p>
            <p class="locator__region">Tamil Nadu, India</p>
            <p class="locator__coords">12.7409&deg; N, 77.8253&deg; E</p>
            <a class="btn btn--outline locator__go" rel="noopener"
               href="https://www.google.com/maps/search/?api=1&amp;query=Shoolgiri%2C+Hosur%2C+Tamil+Nadu%2C+India">
              Get directions</a>
          </div>
        </div>
      </div>

      <form class="form" data-enquiry novalidate>
        <div class="form__row">
          <label class="field">Full name
            <input type="text" name="name" placeholder="Anita Raghavan" autocomplete="name" required>
          </label>
          <label class="field">Company
            <input type="text" name="company" placeholder="Stoneworks Ltd." autocomplete="organization">
          </label>
        </div>
        <div class="form__row">
          <label class="field">Email
            <input type="email" name="email" placeholder="buyer@company.com" autocomplete="email" required>
          </label>
          <label class="field">Destination port
            <input type="text" name="port" placeholder="Rotterdam">
          </label>
        </div>
        <div class="form__row">
          <label class="field">Stone of interest
            <select name="stone" data-stones></select>
          </label>
          <label class="field">Finish
            <select name="finish" data-finishes></select>
          </label>
        </div>
        <label class="field">Requirement
          <textarea name="requirement" rows="4"
            placeholder="e.g. 2 containers, 3cm polished gangsaw slabs, monthly repeat" required></textarea>
        </label>
        <!-- Spam trap. Hidden from people by CSS and from screen readers by
             aria-hidden; a scripted submitter fills every field it finds, so
             anything arriving with this set is discarded. Costs no third-party
             script, no CAPTCHA and nothing for a real buyer to solve. -->
        <div class="hp" aria-hidden="true">
          <label>Fax number
            <input type="text" name="fax" tabindex="-1" autocomplete="off">
          </label>
        </div>
        <button class="btn btn--primary full" type="submit">Send B2B Inquiry</button>
        <p class="form__note" data-form-note role="status" hidden></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer" data-site-footer></footer>
<script type="module" src="/assets/js/pages/contact.js"></script>
</body>
